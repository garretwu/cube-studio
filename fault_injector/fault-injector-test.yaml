    description: "200G Data Network Switch"
    
# =============================================================================
# Fault Scenarios Configuration
# =============================================================================
# Enable and configure fault scenarios to inject.
# Each scenario can target specific nodes and have custom parameters.

scenarios:
  # ---------------------------------------------------------------------------
  # RC-1: GPU Contention
  # ---------------------------------------------------------------------------
  # Uses gpu-burn to saturate GPU(s) and create inference contention.
  gpu_contention:
    enabled: true
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      duration: 180
      # Maps to gpu-burn "-m". Supports values like "60%" or "10240" (MB).
      memory: "90%"
      # Maps to gpu-burn "-i". Omit or set [] to apply to all GPUs.
      gpu_ids: []
      # gpu_ids: [0, 1]
      intensity: 100

  # ---------------------------------------------------------------------------
  # RC-2: Network Jitter
  # ---------------------------------------------------------------------------
  # Uses tc netem to inject network delay and jitter.
  network_jitter:
    enabled: true
    target_nodes:
      #- "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      interface: "roce200"
      delay_ms: 45
      jitter_ms: 90
      distribution: "pareto"
      loss_pct: 0
      duration: 180
      load_simulator:
        enabled: false
        config_path: "load_simulator/config/notebook-soak-only.yaml"
        only:
          - "notebook"
        timeout_seconds: 900
        strict: true

  # ---------------------------------------------------------------------------
  # RC-3: Storage I/O Interference
  # ---------------------------------------------------------------------------
  # Uses fio to add storage pressure that impacts latency.
  storage_io_interference:
    enabled: false
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      duration: 60
      filename: "/data/fault-injector-fio-testfile"
      rw_mode: "randwrite"
      bs: "4k"
      iodepth: 64
      numjobs: 4

  # ---------------------------------------------------------------------------
  # RC-4: Platform Cascade
  # ---------------------------------------------------------------------------
  # Injects platform dependency delay through tc netem.
  platform_cascade:
    enabled: false
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      target_component: "mysql"
      interface: "roce200"
      delay_ms: 120
      port: 3306

  # ---------------------------------------------------------------------------
  # RC-5: OS Resource Pressure
  # ---------------------------------------------------------------------------
  # Uses stress-ng to create CPU + memory pressure.
  os_resource_pressure:
    enabled: true
    target_nodes:
      - "worker-01"
      #- "worker-02"
      #- "worker-03"
    params:
      duration: 30
      vm_bytes_percent: 85
      cpu_workers: 32
      cpu_load: 90
      io_workers: 8

  # ---------------------------------------------------------------------------
  # RC-6: Thermal Throttling
  # ---------------------------------------------------------------------------
  # Lowers GPU power limit to emulate thermal throttling behavior.
  thermal_throttling:
    enabled: false
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      gpu_id: 0
      power_limit: 500
      fan_index: 0
      fan_mode: "Manual"
      fan_pwm: 30
      fan_recover_mode: "Auto"
      fan_control_backend: "ipmi"
      ipmi_profile: "supermicro_raw"
      ipmi_target_pwm: 30

  # Keep RDMA scenarios disabled for this vLLM latency test cycle.
  pfc_deadlock:
    enabled: true
    target_nodes:
      #- "worker-01"
      #- "worker-02"
      - "worker-03"
    params:
      switch: "sw-200g"
      interface: "200GE1/0/3"
      priority: 3
      duration: 120

  ecn_misconfiguration:
    enabled: true
    target_nodes:
      #- "worker-01"
      #- "worker-02"
      - "worker-03"
    params:
      switch: "sw-200g"
      interface: "200GE1/0/3"
      min_threshold: 10
      max_threshold: 20
      duration: 120

  rdma_load_imbalance:
    enabled: false
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      switch: "sw-200g"
      interface: "200GE1/0/4"
      hash_algorithm: "src-dst-ip"

  rdma_link_flap:
    enabled: true
    target_nodes:
      #- "worker-01"
      #- "worker-02"
      - "worker-03"
    params:
      switch: "sw-200g"
      interface: "200GE1/0/3"
      flap_interval: 1
      flap_duration: 30

  roce_mtu_mismatch:
    enabled: true
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      interface: "roce200"
      mtu: 1500
      original_mtu: 9000
      duration: 120

  rdma_qos_downgrade:
    enabled: false
    target_nodes:
      - "worker-01"
      - "worker-02"
      - "worker-03"
    params:
      switch: "sw-200g"
      interface: "200GE1/0/4"
      dscp: 0
      downgraded_tc: 0

