# =============================================================================
# vLLM Inter-Token Latency P95 Live Demo Configuration
# =============================================================================

global:
  session_dir: "./fault_injector/fault_reports/sessions/"
  log_level: "DEBUG"
  safety:
    require_confirmation: false
    auto_recover_timeout: 600
    dry_run: false
    max_concurrent_faults: 3
    excluded_nodes: []

monitor:
  enabled: false
  prometheus_url: "http://10.11.4.3:31260"
  baseline_duration: 60
  post_recovery_duration: 60

demo:
  vllm_inter_token_latency_p95_alert_remediation:
    alert_name: "VLLMInterTokenLatencyP95High"
    alert_severity: "critical"
    node: "worker-03"
    namespace: "service"
    service: "qwen3-32b-fp8-202602261"
    kubeconfig: "~/.kube/config"
    latency_promql: 'histogram_quantile(0.95, sum by(le) (rate(vllm:inter_token_latency_seconds_bucket{namespace="service",service="qwen3-32b-fp8-202602261"}[1m])))'
    latency_threshold_ms: 50
    load_simulator_config: "load_simulator/config/inference-qwen3-32b-fp8-10.11.4.3-20060.yaml"
    load_warmup_seconds: 30
    alert_wait_seconds: 360
    allowed_tools:
      - "prometheus.query_instant"
      - "gpu.get_metrics"
      - "gpu.get_processes"
      - "k8s.list_pods"
      - "network.get_rdma_stats"
    total_timeout: 180
    step_timeout: 60
    max_steps: 6

inventory:
  workers:
    - name: "worker-03"
      ssh:
        host: "10.11.4.12"
        port: 22
        user: "yuyonghao"
        password: "Yuyonghao@123"
        timeout: 30
        use_sudo: true
      interface: "roce200"
      roles:
        - "compute"
        - "rdma"

scenarios:
  gpu_contention:
    enabled: true
    target_nodes:
      - "worker-03"
    params:
      duration: 600
      memory: "90%"
      gpu_ids: [0]
      intensity: 90
