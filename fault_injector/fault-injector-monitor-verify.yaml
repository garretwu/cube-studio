# =============================================================================
# Fault Injector Monitor Verification Profile
# =============================================================================
# Goal:
# - Validate Prometheus connectivity and baseline collection path quickly.
# - Keep fault impact minimal and runtime short.
#
# Run:
#   python -m fault_injector validate-config fault_injector/fault-injector-monitor-verify.yaml
#   python -m fault_injector run --config fault_injector/fault-injector-monitor-verify.yaml -y
# =============================================================================

global:
  session_dir: "./fault_injector/fault_reports/sessions/"
  log_level: "INFO"
  safety:
    require_confirmation: false
    auto_recover_timeout: 1800
    dry_run: false
    max_concurrent_faults: 1
    excluded_nodes: []

orchestrator:
  max_parallel_agents: 1
  observe_interval: 10
  session_dir: "./fault_injector/fault_reports/sessions/"

monitor:
  enabled: true
  prometheus_url: "http://10.11.4.3:31260"
  baseline_duration: 20
  post_recovery_duration: 20
  baseline_queries:
    cpu_util: "avg(1 - rate(node_cpu_seconds_total{mode='idle'}[5m]))"
    memory_util: "avg(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))"
    gpu_util: "avg(DCGM_FI_DEV_GPU_UTIL)"
    gpu_memory_used_mb: "avg(DCGM_FI_DEV_FB_USED)"
    gpu_power_watts: "avg(DCGM_FI_DEV_POWER_USAGE)"
  baseline_require_non_zero:
    - cpu_util
    - memory_util
    - gpu_memory_used_mb
    - gpu_power_watts
  baseline_min_samples: 2
  baseline_max_error_ratio: 0.3

inventory:
  workers:
    - name: "worker-02"
      ssh:
        host: "10.11.4.11"
        port: 22
        user: "yuyonghao"
        password: "Yuyonghao@123"
        timeout: 30
        use_sudo: true
      interface: "roce200"
      roles: ["compute", "rdma"]

scenarios:
  network_jitter:
    enabled: true
    target_nodes: ["worker-02"]
    params:
      interface: "roce200"
      delay_ms: 5
      jitter_ms: 5
      distribution: "normal"
      loss_pct: 0
      duration: 20
      load_simulator:
        enabled: false
        config_path: "load_simulator/config/inference-soak.yaml"
        only: ["inference"]
        timeout_seconds: 300
        strict: true

  gpu_contention:
    enabled: false
    target_nodes: []
    params: {}

  storage_io_interference:
    enabled: false
    target_nodes: []
    params: {}

  platform_cascade:
    enabled: false
    target_nodes: []
    params: {}

  os_resource_pressure:
    enabled: false
    target_nodes: []
    params: {}

  thermal_throttling:
    enabled: false
    target_nodes: []
    params: {}

  pfc_deadlock:
    enabled: false
    target_nodes: []
    params: {}

  ecn_misconfiguration:
    enabled: false
    target_nodes: []
    params: {}

  rdma_load_imbalance:
    enabled: false
    target_nodes: []
    params: {}

  rdma_link_flap:
    enabled: false
    target_nodes: []
    params: {}

  roce_mtu_mismatch:
    enabled: false
    target_nodes: []
    params: {}

  rdma_qos_downgrade:
    enabled: false
    target_nodes: []
    params: {}
