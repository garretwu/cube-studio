# =============================================================================
# Fault Injector Demo Configuration Template
# =============================================================================
# Dedicated config for live Auto-SRE demos. Keep demo alert context separate
# from generic fault injection test configs.

global:
  session_dir: "./fault_injector/fault_reports/sessions/"
  log_level: "INFO"
  safety:
    require_confirmation: false
    auto_recover_timeout: 600
    dry_run: true
    max_concurrent_faults: 3
    excluded_nodes: []

monitor:
  enabled: true
  prometheus_url: "http://10.11.4.3:31260"
  baseline_duration: 60
  post_recovery_duration: 60

demo:
  gpu_utilization_high_alert_remediation:
    alert_name: "GPUUtilizationHigh"
    alert_severity: "critical"
    node: "worker-01"
    kubeconfig: "~/.kube/config"
    allowed_tools:
      - "gpu.get_metrics"
      - "gpu.get_processes"
      - "prometheus.query_instant"
      - "k8s.list_pods"
    output: "data/demo/gpu-utilization-high-demo.txt"
    output_format: "txt"
    total_timeout: 180
    step_timeout: 60
    max_steps: 5

inventory:
  workers:
    - name: "worker-01"
      ssh:
        host: "192.168.1.101"
        port: 22
        user: "root"
        key_file: "~/.ssh/id_rsa"
        password: null
        timeout: 30
        use_sudo: true
      interface: "eth0"
      roles:
        - "compute"
        - "rdma"

scenarios:
  gpu_contention:
    enabled: true
    target_nodes:
      - "worker-01"
    params:
      duration: 60
      memory: "90%"
      gpu_ids: [0]
      intensity: 100
