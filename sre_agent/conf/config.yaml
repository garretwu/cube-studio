ontology:
  db_path: ./data/ontology.lab.db
  discovery:
    mode: live
    auto_discovery: true
    refresh_interval_seconds: 120
    live_inventory_path: sre_agent/conf/live_inventory.lab.yaml
    live_fallback_to_static: true
    k8s_cluster_name: aidc-lab
    k8s_namespaces:
      - default
      - sre
      - inference
    prometheus_targets:
      cpu_util: worker-01
      memory_util: worker-04
      gpu_util: worker-01
      gpu_memory_used_mb: worker-02
      gpu_power_watts: worker-03
    switches:
      - id: sw-200g
        name: sw-200g
        type: H3C S9855-24B8D
        status: online
        source: real-test
        mgmt_host: "10.11.8.52"
        inventory_source: "sre_agent/conf/live_inventory.lab.yaml"
        ports:
          - id: sw-200g:200GE1/0/1
            name: 200GE1/0/1
            connected_to: worker-01
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
