global:
  aidc_id: lab-aidc
  prometheus_url: "http://10.11.4.3:31260"
  alertmanager_url: "http://10.11.4.3:31013/"
  loki_url: "http://10.11.4.2:30628"
  auto_diagnose_alert_names:
    - GPUCardMissing
  auto_diagnose_entity_correlation_count: 2

llm:
  api_key: "sk-sp-4d2bf2aafa0e4ba9a9839bbfef78b6e2"
  base_url: "https://coding.dashscope.aliyuncs.com/v1"
  model: "MiniMax-M2.5"

# Another config for backup and testing, using a different model and provider to ensure flexibility and robustness of the agent.
#  provider: glm
#  api_key: "904d43af670c4e87bbfdca55d502520a.wH2jArRDuTGwa6xw"
#  base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
#  model: "glm-5.1"

agent:
  reasoning_context_strategy: transcript_compact
  reasoning_overflow_behavior: compact
  reasoning_input_target_tokens: 32000
  reasoning_model_family: "MiniMax-M2.5"
  #reasoning_model_family: "glm-5.1"
  ttft_external_process_default_node: "10.11.4.13"
  step_timeout_sec: 240
  total_timeout_sec: 900

knowledge_base:
  provider: dify
  base_url: "http://10.11.4.3:31984/"
  api_key: "dataset-OiFA2zZ7CwCMPPUKzU0sbIaG"
  dataset_id: "dataset-OiFA2zZ7CwCMPPUKzU0sbIaG"
  runbook_dataset_id: "dataset-OiFA2zZ7CwCMPPUKzU0sbIaG"
  timeout: 15
  retries: 2
  api_prefix: "/v1"
  persist_dir: ./data/knowledge_db_lab

memory:
  db_dir: ./data/memory_lab
  vector_index_dir: ./data/memory_vectors_lab

remediation:
  observation_seconds: 600
  observation_poll_seconds: 10

ontology:
  db_path: ./data/ontology.lab.db
  discovery:
    mode: hybrid
    auto_discovery: true
    refresh_interval_seconds: 120
    unified_inventory_path: sre_agent/conf/ontology.unified.lab.yaml
    live_inventory_path: sre_agent/conf/live_inventory.lab.yaml
    live_fallback_to_static: false
    k8s_cluster_name: aidc-lab
    k8s_namespaces: []
    prometheus_targets:
      cpu_util: wj-lab-cpt-01
      memory_util: wj-lab-cpt-04
      gpu_util: wj-lab-cpt-01
      gpu_memory_used_mb: wj-lab-cpt-02
      gpu_power_watts: wj-lab-cpt-03
    switches:
      - id: sw-200g
        name: sw-200g
        type: H3C S9855-24B8D
        status: online
        source: real-test
        mgmt_host: "10.11.8.52"
        inventory_source: "sre_agent/conf/live_inventory.lab.yaml"
        ports:
          - id: sw-200g:200GE1/0/1
            name: 200GE1/0/1
            connected_to: wj-lab-cpt-01
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/2
            name: 200GE1/0/2
            connected_to: wj-lab-cpt-02
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/3
            name: 200GE1/0/3
            connected_to: wj-lab-cpt-03
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/4
            name: 200GE1/0/4
            connected_to: wj-lab-cpt-04
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/13
            name: 200GE1/0/13
            connected_to: wj-lab-stor-01
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/14
            name: 200GE1/0/14
            connected_to: wj-lab-stor-02
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic
          - id: sw-200g:200GE1/0/15
            name: 200GE1/0/15
            connected_to: wj-lab-stor-03
            status: up
            speed_gbps: 200
            source: static-fallback
            mapping_source: inventory_heuristic

