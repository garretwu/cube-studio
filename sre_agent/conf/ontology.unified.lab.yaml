      switch_id: sw-25g
      connected_node_id: wj-lab-cpt-04
      nic: ens2f0np0
      status: up
      speed_gbps: 25
    - id: sw-25g:WGE1/0/5
      name: WGE1/0/5
      switch_id: sw-25g
      connected_node_id: wj-lab-ctl-01
      nic: ens2f0np0
      status: up
