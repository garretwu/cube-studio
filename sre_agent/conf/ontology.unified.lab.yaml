          nic: ens2f0np0
    # --- CPU/control nodes: 25G only (ens2f0np0) ---
    - id: wj-lab-ctl-01
      name: wj-lab-ctl-01
      role: cpu
      source: unified_static
      status: online
      switch_ports:
        - switch_id: sw-25g
          port_id: sw-25g:WGE1/0/5
          nic: ens2f0np0
    - id: wj-lab-ctl-02
      name: wj-lab-ctl-02
      role: cpu
      source: unified_static
      status: online
