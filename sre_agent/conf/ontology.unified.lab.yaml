    # --- Storage nodes: 200G (roce200) + 25G (ens2f0np0) ---
    - id: wj-lab-stor-01
      name: wj-lab-stor-01
      role: storage
      source: unified_static
      status: online
      switch_ports:
        - switch_id: sw-200g
