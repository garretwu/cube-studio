dynamic_discovery:
  k8s:
    cluster_name: aidc-lab
    namespaces:
      - ai-models
      - aihub
      - ceph-csi
      - cert-manager
      - dify
      - envoy-ai-gateway-system
      - envoy-gateway-system
      - infra
      - istio-system
      - jupyter
      - kagent
      - llm
      - llm-d
      - logging
      - lws-system
      - monitoring
      - nvidia-dcgm
      - nvidia-device-plugin
      - service
      - storage-system
    kubeconfig: sre_agent/conf/kube.conf

  prometheus:
    url: http://10.11.4.3:31260
    baseline_queries:
      cpu_util: avg(1 - rate(node_cpu_seconds_total{mode="idle"}[5m]))
      memory_util: avg(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
      gpu_util: avg(DCGM_FI_DEV_GPU_UTIL)
      gpu_memory_used_mb: avg(DCGM_FI_DEV_FB_USED)
      gpu_power_watts: avg(DCGM_FI_DEV_POWER_USAGE)
    targets:
      cpu_util: wj-lab-cpt-01
      memory_util: wj-lab-cpt-04
      gpu_util: wj-lab-cpt-01
      gpu_memory_used_mb: wj-lab-cpt-02
      gpu_power_watts: wj-lab-cpt-03

  node_providers:
    workers:
      - name: wj-lab-cpt-01
        role: gpu
        ssh:
          host: 10.11.4.10
          port: 22
          user: yuyonghao
          password: ${SRE_WORKER_01_SSH_PASSWORD}
          timeout: 30
          use_sudo: true
        redfish:
          bmc_host: 10.11.8.10
          username: admin
          password: ${SRE_REDFISH_PASSWORD}
          verify_tls: false
          timeout: 30
      - name: wj-lab-cpt-02
        role: gpu
        ssh:
          host: 10.11.4.11
          port: 22
          user: yuyonghao
          password: ${SRE_WORKER_02_SSH_PASSWORD}
