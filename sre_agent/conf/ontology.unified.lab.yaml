static_topology:
  clusters:
    - id: cluster:aidc-lab
      name: aidc-lab
      source: unified_static
      status: online
      region: cn
      zone: zone-a
      domain: aidc
      switch_ids:
        - sw-200g
        - sw-25g

  switches:
    - id: sw-200g
      name: sw-200g
      type: H3C S9855-24B8D
      source: unified_static
      status: online
      mgmt_host: 10.11.8.52
    - id: sw-25g
      name: sw-25g
      type: H3C S9855-24B8D
      source: unified_static
      status: online
      mgmt_host: 10.11.8.51

  switch_ports:
    # --- sw-200g: GPU + Storage nodes, NIC roce200 ---
    - id: sw-200g:200GE1/0/1
      name: 200GE1/0/1
      switch_id: sw-200g
      connected_node_id: wj-lab-cpt-01
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/2
      name: 200GE1/0/2
      switch_id: sw-200g
      connected_node_id: wj-lab-cpt-02
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/3
      name: 200GE1/0/3
      switch_id: sw-200g
      connected_node_id: wj-lab-cpt-03
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/4
      name: 200GE1/0/4
      switch_id: sw-200g
      connected_node_id: wj-lab-cpt-04
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/13
      name: 200GE1/0/13
      switch_id: sw-200g
      connected_node_id: wj-lab-stor-01
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/14
      name: 200GE1/0/14
      switch_id: sw-200g
      connected_node_id: wj-lab-stor-02
      nic: roce200
      status: up
      speed_gbps: 200
    - id: sw-200g:200GE1/0/15
      name: 200GE1/0/15
      switch_id: sw-200g
      connected_node_id: wj-lab-stor-03
      nic: roce200
      status: up
      speed_gbps: 200
    # --- sw-25g: ALL nodes, NIC ens2f0np0 ---
    - id: sw-25g:WGE1/0/1
      name: WGE1/0/1
      switch_id: sw-25g
      connected_node_id: wj-lab-cpt-01
      nic: ens2f0np0
      status: up
      speed_gbps: 25
    - id: sw-25g:WGE1/0/2
      name: WGE1/0/2
      switch_id: sw-25g
      connected_node_id: wj-lab-cpt-02
      nic: ens2f0np0
      status: up
      speed_gbps: 25
    - id: sw-25g:WGE1/0/3
      name: WGE1/0/3
      switch_id: sw-25g
      connected_node_id: wj-lab-cpt-03
      nic: ens2f0np0
      status: up
      speed_gbps: 25
    - id: sw-25g:WGE1/0/4
