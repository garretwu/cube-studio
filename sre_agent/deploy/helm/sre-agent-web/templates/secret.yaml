{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-secrets" (include "sre-agent-web.fullname" .)) .Values.secret.name }}
  labels:
    {{- include "sre-agent-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  SRE_OPENAI_API_KEY: {{ .Values.secret.sreOpenaiApiKey | quote }}
{{- end }}
