# load-simulator config — single-target vLLM inference benchmark
# Target: http://10.11.4.3:20060
# Model: Qwen3-32B-FP8

session_id: ""
agents:
  - inference
mode: "single"

global_config:
  cube_studio_url: "http://10.11.4.3:32655"
  prometheus_url: "http://10.11.4.3:31260"
  project_id: 1
  auth_method: "username"
  auth_username: "admin"
  jwt_password: ""

channels:
  inference:
    timeout: 120
    retry_count: 1
    retry_backoff: 0.5

inference:
  enabled: true
  endpoint: "http://10.11.4.3:20060"
  api_key: ""
  model: "Qwen3-32B-FP8"
  max_tokens: 256
  concurrency: 4
  duration_seconds: 60
  prompt_pool_size: 32
  stream: false

pipeline:
  enabled: false

finetune:
  enabled: false

notebook:
  enabled: false
